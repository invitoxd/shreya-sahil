<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We're getting married</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #faf9f6; /* Ivory */
  --card: #ffffff;
  --text: #333333; /* Charcoal-grey */
  --blue: #8ba9c1; /* Powder-blue */
  --blue-line: #b3cddf;
  --blue-soft: #a1b8c7;
  --heart: #8ba9c1;
  --script: "Pinyon Script", cursive;
  --body: "Cormorant Garamond", serif;
  --head: "Bodoni Moda", serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);text-align:center;overflow-x:hidden;
padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
h2{font-family:var(--script);font-weight:400;font-size:clamp(2.6rem,12vw,4rem);line-height:1.1}
section{padding:4rem 1.1rem;position:relative}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* scroll progress bar */
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--blue);transform:scaleX(0);transform-origin:left;z-index:20}

/* scroll reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.ev.r.rv{transform:translateX(40px)}.ev.l.rv{transform:translateX(-40px)}.ev.rv.in{transform:none}

/* drifting clouds (schedule section) */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sky~*{position:relative;z-index:1}
.cw{position:absolute;left:0;will-change:transform}
.cloud{display:block;filter:blur(3px);animation:drift linear infinite}
.cloud svg{display:block;width:100%;height:auto}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}

/* ==========================================================================
   HERO SECTION & SUNSET ANIMATION
   ========================================================================== */
#hero {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  align-content: center;
  padding: 0 1rem;
  overflow: hidden;
  position: relative;
  background: var(--bg);
}

/* Layer 1: The Sky Backgrounds */
.sky-base {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, #b4d4e4 0%, #d1e2eb 60%, #e8eceb 100%);
  z-index: 0;
}

.sky-sunset {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, #f3bca8 0%, #f0c3b8 40%, #e8ba98 70%, #d19f88 100%);
  z-index: 1;
  opacity: 0;
  animation: sunsetFade 50s var(--ease) forwards;
}

.sky-twilight {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, #a29bba 0%, #d0b5c1 50%, #dca2a3 100%);
  z-index: 2;
  opacity: 0;
  animation: twilightFade 60s var(--ease) forwards;
}

/* Layer 2: The Sun */
.sun-container {
  position: absolute;
  inset: 0;
  z-index: 3;
  overflow: hidden;
}

.sun {
  position: absolute;
  top: 15%; /* Starts high in the sky */
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,249,219,0.8) 40%, rgba(255,229,153,0) 70%);
  border-radius: 50%;
  animation: sunDescend 50s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* Layer 3: Original Image & Scene Integration */
/* Assuming images/hero.jpg is the arch. We use multiply/overlay to blend it */
.hero-image-layer {
  position: absolute;
  inset: 0;
  background: url("images/hero.jpg") center/cover no-repeat;
  z-index: 4;
  /* This blend mode allows the sky colors behind to faintly tint the image */
  mix-blend-mode: multiply; 
}

/* Lighting overlay to warm up the stone arch as sun sets */
.lighting-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(245, 185, 145, 0) 0%, rgba(210, 140, 100, 0.4) 100%);
  z-index: 5;
  opacity: 0;
  mix-blend-mode: overlay;
  animation: sunsetFade 50s var(--ease) forwards;
}

/* Layer 4: The Animated Lake / Water Ripples */
.lake-water {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 35%; /* Adjust based on where the water horizon is in your image */
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 4px,
    rgba(255, 255, 255, 0.1) 5px,
    rgba(255, 255, 255, 0.15) 6px
  );
  background-size: 100% 200%;
  z-index: 6;
  opacity: 0.6;
  animation: waterRipple 8s linear infinite;
  /* Mask it softly at the top horizon line */
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
}

.lake-reflection {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 35%;
  background: radial-gradient(ellipse at top, rgba(255, 220, 150, 0.6) 0%, transparent 70%);
  z-index: 7;
  opacity: 0;
  animation: reflectionFade 50s var(--ease) forwards;
  -webkit-mask-image: repeating-linear-gradient(0deg, transparent, transparent 3px, black 4px, black 5px);
  mask-image: repeating-linear-gradient(0deg, transparent, transparent 3px, black 4px, black 5px);
}

/* Text Layer */
.hero-content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: -10vh; /* Lift slightly to center within arch */
}

#hero h1 {
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(3.2rem, 13vw, 5rem); /* Elegant scaling */
  line-height: 1.1;
  color: var(--text);
  margin: 0 auto;
  max-width: 95vw;
  text-shadow: 0 2px 20px rgba(255, 255, 255, 0.9), 0 0 10px rgba(255,255,255,0.5); /* Glowing text keeps it legible over changing background */
}

#hero p {
  font-family: var(--body);
  font-size: clamp(1.4rem, 6vw, 1.8rem);
  color: var(--text);
  margin-top: 0.5rem;
  opacity: 0;
  animation: fade 1.2s ease forwards 1.3s;
  text-shadow: 0 2px 15px rgba(255, 255, 255, 0.9);
}

/* Sunset Keyframes */
@keyframes sunDescend {
  0%   { top: 15%; background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,249,219,0.8) 40%, rgba(255,229,153,0) 70%); }
  50%  { top: 40%; background: radial-gradient(circle, rgba(255,240,200,1) 0%, rgba(255,210,120,0.8) 50%, rgba(255,180,80,0) 80%); }
  85%  { top: 62%; background: radial-gradient(circle, rgba(255,180,100,1) 0%, rgba(255,130,80,0.8) 50%, rgba(200,80,50,0) 80%); opacity: 1; }
  100% { top: 72%; background: radial-gradient(circle, rgba(255,100,80,1) 0%, rgba(200,60,40,0.8) 40%, rgba(150,40,30,0) 70%); opacity: 0; } /* Dips below horizon */
}

@keyframes sunsetFade {
  0%   { opacity: 0; }
  30%  { opacity: 0.2; }
  70%  { opacity: 0.8; }
  90%  { opacity: 1; }
  100% { opacity: 0.7; } /* Fades slightly as twilight sets in */
}

@keyframes twilightFade {
  0%   { opacity: 0; }
  75%  { opacity: 0; }
  100% { opacity: 0.8; }
}

@keyframes waterRipple {
  0% { background-position: 0% 0%; }
  100% { background-position: 0% 100%; }
}

@keyframes reflectionFade {
  0%   { opacity: 0; width: 100px; }
  50%  { opacity: 0.6; width: 150px; }
  85%  { opacity: 0.8; width: 220px; }
  100% { opacity: 0; width: 250px; }
}

.w{display:inline-block;opacity:0;transform:translateY(22px);filter:blur(8px);animation:wi 1.2s var(--ease) forwards;animation-delay:calc(var(--i)*.28s + .2s)}
@keyframes wi{to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
.scrollcue{position:absolute!important;left:50%;bottom:calc(1.6rem + env(safe-area-inset-bottom,0px));width:22px;height:34px;margin-left:-11px;border:2px solid var(--blue);border-radius:14px;opacity:0;animation:fade 1s ease forwards 2.2s;z-index:20}
.scrollcue:after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;margin-left:-2px;border-radius:3px;background:var(--blue);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}

/* hero effects: birds + petals */
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:15}
.bird{position:absolute;left:0;width:var(--s,34px);color:#6a5448;opacity:.8;animation:fly var(--t,24s) linear infinite;animation-delay:var(--dl,0s);will-change:transform}
.bird svg{display:block;width:100%;height:auto;overflow:visible}
.wing{transform-origin:20px 12px;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.55)}}
@keyframes fly{0%{transform:translate(-15vw,0)}50%{transform:translate(55vw,var(--dy,-6vh))}100%{transform:translate(120vw,var(--dy2,4vh))}}
.petal{position:absolute;top:0;width:var(--w,12px);height:calc(var(--w,12px)*1.3);border-radius:80% 0 80% 0;opacity:0;box-shadow:inset -2px -2px 4px rgba(190,110,90,.25);animation:fall var(--t,12s) linear infinite;animation-delay:var(--dl,0s);will-change:transform}
@keyframes fall{0%{transform:translate3d(0,-8vh,0) rotate(0);opacity:0}8%{opacity:.9}30%{transform:translate3d(var(--x1),30vh,0) rotate(140deg)}60%{transform:translate3d(var(--x2),65vh,0) rotate(330deg)}92%{opacity:.85}100%{transform:translate3d(var(--x3),108vh,0) rotate(560deg);opacity:0}}

/* the date & countdown */
#date .hint{color:var(--blue-soft);font-size:clamp(1.3rem,6vw,2rem);margin:1.2rem 0 1.5rem;font-family:var(--body);font-style:italic}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;max-width:500px;margin:auto;perspective:900px}
.cell span{display:block;font-size:.72rem;letter-spacing:.3em;color:var(--blue-soft);margin-top:.9rem;padding-left:.3em;font-family:var(--body);}
.card{position:relative;aspect-ratio:7/8;background:var(--card);border-radius:22px;box-shadow:0 8px 28px rgba(150,120,100,.08);display:grid;place-items:center;
font-family:var(--body);font-size:clamp(1.2rem,6vw,2.2rem);overflow:hidden;transform:rotateX(-85deg);transform-origin:top;transition:transform 1.1s var(--ease) calc(var(--d,0s) + .1s)}
.cell.in .card{transform:none}
.count{display:flex;justify-content:center;gap:clamp(.8rem,4vw,1.6rem);margin-top:1.8rem;font-family:var(--body);}
.count div{min-width:58px}
.count b{display:block;font-weight:600;font-size:clamp(1.6rem,7vw,2.3rem);color:var(--blue)}
.count small{font-size:.7rem;letter-spacing:.25em;color:var(--blue-soft);text-transform:uppercase;padding-left:.25em}
#invited{font-family:var(--script);font-size:clamp(2.4rem,11vw,3.6rem);margin:2.5rem 0 2rem}

/* envelope letter */
.env{position:relative;max-width:540px;aspect-ratio:1060/1275;margin:0 auto;clip-path:inset(-300% -5% 0 -5%)}
.env svg.back,.env svg.front{position:absolute;left:0;width:100%;display:block}
.env svg.back{top:0;height:100%;z-index:0;filter:drop-shadow(0 10px 18px rgba(80,120,150,.18))}
.env svg.front{bottom:-1px;height:calc(58.8% + 1px);z-index:2;filter:drop-shadow(0 -3px 6px rgba(80,120,150,.12))}
.seal{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.letter{position:absolute;z-index:1;left:7%;right:7%;bottom:22%;will-change:transform;background:#fff;padding:1.6rem 1rem 3.6rem;box-shadow:0 6px 24px rgba(80,120,150,.10)}
.letter h3{font-family:var(--script);font-weight:400;font-size:clamp(1.6rem,6.5vw,2.3rem);line-height:1.15;margin-bottom:.9rem;color:var(--text)}
.letter p{font-size:clamp(.85rem,3.5vw,1.1rem);line-height:1.5;margin-bottom:.9rem;font-family:var(--body)}
.letter .sign{margin-bottom:.2rem}.letter .sign+.sign{font-family:var(--script);font-size:clamp(1.6rem,7vw,2.2rem)}
.hearts{display:block;margin:0 auto 1.5rem;width:80px;padding:8px;cursor:pointer;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}

/* schedule timeline: centred line, events alternate left / right */
#schedule{overflow:hidden}
#schedule h2{margin-bottom:2.6rem}
.tl{position:relative;max-width:520px;margin:auto;--p:0}
.tl:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:3px;background:var(--blue-line);transform:translateX(-50%) scaleY(var(--p));transform-origin:top}
.ev{position:relative;width:50%;padding:0 1.2rem;margin-bottom:2.2rem;min-height:5.5rem}
.ev:after{content:"";position:absolute;top:12px;width:16px;height:16px;background:var(--blue);transform:translateX(-50%) rotate(45deg) scale(0);transition:transform .7s var(--ease) .25s}
.ev.in:after{transform:translateX(-50%) rotate(45deg) scale(1)}
.ev b{display:block;font-weight:500;font-size:clamp(1.8rem,8vw,2.8rem);line-height:1;font-family:var(--body)}
.ev em{display:block;font-style:normal;color:var(--blue-soft);font-size:1rem;margin-top:.3rem;font-family:var(--body)}
.dayh{position:relative;z-index:1;background:var(--bg);padding:1rem 0;margin:0 0 1.4rem}
.dayh h3{font-family:var(--script);font-weight:400;font-size:clamp(2.4rem,10vw,3.2rem)}
.dayh small{color:var(--blue-soft);font-size:1.1rem;font-family:var(--body)}
.ev span{display:block;font-size:clamp(1.15rem,5vw,1.6rem);line-height:1.25;margin-top:.5rem;font-family:var(--body)}
.ev.r{margin-left:50%}.ev.r:after{left:0}
.ev.l{margin-right:50%}.ev.l:after{right:0;left:auto;transform:translateX(50%) rotate(45deg) scale(0)}
.ev.l.in:after{transform:translateX(50%) rotate(45deg) scale(1)}
@media(max-width:560px){
 .ev{padding:0 .8rem;margin-bottom:2rem}
 .ev b{font-size:clamp(1.6rem,8vw,2.2rem)}
 .ev span{font-size:1.1rem}
 .ev em{font-size:.88rem;line-height:1.3}
}

/* venue */
.venue{display:flex;gap:1rem;align-items:center;text-align:left;max-width:560px;margin:2.2rem auto 1.8rem}
.venue svg{flex:none;width:46px;animation:bob 3s ease-in-out infinite}
.venue b{display:block;font-weight:500;font-size:clamp(1.6rem,7vw,2.3rem);font-family:var(--body)}
.venue span{font-size:clamp(1.1rem,5vw,1.6rem);font-family:var(--body)}
.photo{width:100%;max-width:640px;aspect-ratio:4/3;object-fit:cover;border-radius:0 0 40px 0;background:linear-gradient(#cfe0ea,#e8efe4);clip-path:inset(0 0 100% 0);transform:scale(1.08);transition:clip-path 1.4s var(--ease),transform 1.8s var(--ease)}
.photo.in{clip-path:inset(0);transform:none}

/* wardrobe planner */
#dress{overflow:hidden}
#dress .sub{font-size:.8rem;letter-spacing:.32em;color:var(--blue-soft);margin-top:.9rem;padding-left:.32em;font-family:var(--body)}
#dress .date{font-size:.72rem;letter-spacing:.22em;color:var(--blue-soft);margin-top:.5rem;display:flex;align-items:center;justify-content:center;gap:.8rem;font-family:var(--body)}
#dress .date:before,#dress .date:after{content:"";width:clamp(24px,10vw,70px);height:1px;background:var(--blue-line)}
#dress .hint{color:var(--blue-soft);font-size:1.05rem;margin:1.4rem 0 2.6rem;font-family:var(--body);font-style:italic}
#wp{max-width:760px;margin:0 auto}
.wr{display:grid;gap:.2rem;justify-items:center;margin-bottom:2.6rem}
.wr:not(:last-child):after{content:"";width:9px;height:9px;background:var(--blue);transform:rotate(45deg);margin:1.2rem 0 0}
.art{position:relative;isolation:isolate;width:min(86%,360px);cursor:pointer;opacity:0;transform:translateX(-120px) rotate(-3deg);transition:opacity 1.1s var(--ease),transform 1.3s var(--ease)}
.wr.rt .art{transform:translateX(120px) rotate(3deg)}
.wr.in .art{opacity:1;transform:none}
.art img{display:block;width:100%;height:auto;mix-blend-mode:multiply;
-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 6%,#000 94%,transparent);-webkit-mask-composite:source-in;
mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 6%,#000 94%,transparent);mask-composite:intersect;
transform-origin:50% 0;animation:sway 5.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
.art.wig img{animation:wig 1.3s var(--ease)}
@keyframes wig{15%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}65%{transform:rotate(-3deg)}85%{transform:rotate(1.5deg)}}
.info{width:100%;max-width:420px;text-align:left;padding:.4rem .6rem 0}
.info>*{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.wr.in .info>*{opacity:1;transform:none}
.wr.in .info>:nth-child(1){transition-delay:.4s}.wr.in .info>:nth-child(2){transition-delay:.55s}.wr.in .info>:nth-child(3){transition-delay:.7s}.wr.in .info>:nth-child(4){transition-delay:.85s}.wr.in .info>:nth-child(5){transition-delay:1s}.wr.in .info>:nth-child(6){transition-delay:1.1s}
.wr.in .sw i{animation:pop .6s var(--ease) backwards;animation-delay:calc(1.2s + var(--k)*.1s)}
@keyframes pop{from{transform:scale(0)}}
.info h3{font-family:var(--script);font-weight:400;font-size:clamp(2.5rem,11vw,3.4rem);line-height:1.1;margin-bottom:.7rem;color:var(--text)}
.ln{display:flex;gap:.8rem;align-items:flex-start;font-size:1.02rem;line-height:1.35;margin-top:.55rem}
.ln svg{flex:none;width:20px;height:20px;margin-top:1px;fill:none;stroke:var(--blue);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ln small{display:block;font-size:.72rem;letter-spacing:.24em;color:var(--blue-soft);font-family:var(--body)}
.info .code{font-family:var(--body);color:var(--blue);font-size:1.3rem;line-height:1.2;font-weight:600}
.info .note{font-size:.95rem;line-height:1.5;color:var(--text);margin-top:.9rem;padding-top:.8rem;border-top:1px solid rgba(146,187,208,.45);font-family:var(--body)}
.sw{display:flex;gap:.55rem;margin-top:1rem}
.sw i{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 9px rgba(90,70,40,.12)}
@media(min-width:760px){
