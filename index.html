    target="_blank"
    rel="noopener"
  >
    RSVP
  </a>
</section>

<section id="closing" class="rv">
  <h2>Hope to see you there!</h2>
  <p class="closing-names">Shreya &amp; Sahil</p>
  <span class="closing-heart">♡</span>
</section>

<button id="play" aria-label="Play music" hidden>
  <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
</button>
<audio id="music" loop></audio>

<script>
/* Wedding details */
const C = {
  names: "Shreya & Sahil",
  full: "Shreya Maini & Sahil Suneja",
  date: { day: "30", month: "January", year: "2027" },
  time: "13:00:00",

  letter: [
    "As Shreya and Sahil begin this beautiful new chapter, we can’t imagine celebrating it without the people who mean so much to us.",
    "Your love has been a part of our journey, and having you by our side as we begin our forever would make this moment even more special.",
    "With all our love,",
    "Shreya & Sahil ♡"
  ],

  days: [
    {
      title: "Day 1",
      sub: "30th January 2027",
      items: [
        ["1 PM", "Haldi", "Coconut Grove"],
        ["6:30 PM", "Cocktail", "Varca Ballroom"]
      ]
    },
    {
      title: "Day 2",
      sub: "31st January 2027",
      items: [
        ["10 AM", "Chooda Ceremony", "The lawns"],
        ["11 AM", "Sehrabandi", "Same venue as Chooda"],
        ["12 PM", "Baraat", ""],
        ["2 PM", "Pheras", "Beach venue"],
        ["7 PM", "Afterparty", "Varca Ballroom"]
      ]
    }
  ],

  venue: {
    name: "Caravela Resort",
    address: "Goa",
    image: "images/Caravela-resort.png"
  },

  dress: [
    {
      name: "Haldi",
      time: "1 PM ONWARDS",
      place: "Coconut Grove",
      code: "Beachside Festive Chic",
      note: "All silhouettes are welcome. Think breezy outfits: western, Indian or Indo-western.",
      pal: ["#f2b83c","#f4a58a","#a7d8cc","#fffaf0"],
      img: "images/rack-haldi.jpg"
    },
    {
      name: "Cocktail",
      time: "6:30 PM ONWARDS",
      place: "Varca Ballroom",
      code: "Black Tie Glamour",
      note: "Gowns, dresses or even sarees for women. Tuxedos and formal suits for men.",
      pal: ["#1c1c24","#2e3a5c","#c8b79a","#d9dde3"],
      img: "images/rack-cocktail.jpg"
    },
    {
      name: "Wedding & Pheras",
      time: "2 PM ONWARDS",
      place: "Beach Venue",
      code: "A Palette of Ivory and Gold",
      note: "All silhouettes are welcome.",
      pal: ["#f7f0e3","#e9d9b4","#c9a24a","#a98532"],
      img: "images/rack-pheras.jpg"
    },
    {
      name: "Afterparty",
      time: "7 PM ONWARDS",
      place: "Varca Ballroom",
      code: "Bollywood After-Dark Glam",
      note: "Indo-western outfits, mini dresses, statement sets and comfortable shoes.",
      pal: ["#7a1f3d","#d6336c","#1f6f6b","#2b2b3a"],
      img: "images/rack-afterparty.jpg"
    }
  ],

  music: ""
};

const $ = id => document.getElementById(id);
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp01 = v => Math.min(1,Math.max(0,v));
const rnd = (a,b) => a + Math.random()*(b-a);
const small = innerWidth < 600;
let ticking = false;

document.title = C.full + " are getting married";
$("names").innerHTML = C.names.split(" ").map((w,i) =>
  `<span class="w" style="--i:${i}">${w}</span>`
).join(" ");

/* Start the 25 second sunset once the hero photo is ready */
(function() {
  const hero = $("hero"), bg = $("bg");
  const go = () => hero.classList.add("play");
  (bg.decode ? bg.decode() : Promise.resolve()).catch(() => {}).then(go);
})();

$("lt").innerHTML = C.letter.map((t,i) =>
  `<p class="${i > 1 ? "sign" : ""}">${t}</p>`
).join("");

$("vname").textContent = C.venue.name;
$("vaddr").textContent = "Address: " + C.venue.address;

$("vimg").onerror = e => {
  const d = document.createElement("div");
  d.className = e.target.className;
  e.target.replaceWith(d);
  io.observe(d);
};
$("vimg").src = C.venue.image;

[["cd",C.date.day],["cm",C.date.month],["cy",C.date.year]]
  .forEach(([id,v]) => $(id).textContent = v);

/* Build event timeline */
$("tl").innerHTML = C.days.map(d =>
  `<div class="dayh rv"><h3>${d.title}</h3><small>${d.sub}</small></div>` +
  d.items.map(([t,n,p],i) =>
    `<div class="ev rv ${i % 2 ? "l" : "r"}">
      <b>${t}</b><span>${n}</span>${p ? `<em>${p}</em>` : ""}
    </div>`
  ).join("")
).join("");

/* Countdown */
const target = new Date(`${C.date.month} ${C.date.day}, ${C.date.year} ${C.time || "00:00:00"}`);

function tick() {
  const ms = target - Date.now();

  if (isNaN(ms)) {
    $("count").hidden = true;
    return;
  }

  if (ms <= 0) {
    $("count").innerHTML = `<div style="min-width:0"><b>Today's the day ♡</b></div>`;
    return;
  }

  const s = Math.floor(ms/1000);
  const parts = [
    ["Days",Math.floor(s/86400)],
    ["Hours",Math.floor(s%86400/3600)],
    ["Mins",Math.floor(s%3600/60)],
    ["Secs",s%60]
  ];

  $("count").innerHTML = parts.map(([l,v]) =>
    `<div><b>${String(v).padStart(2,"0")}</b><small>${l}</small></div>`
  ).join("");
}

tick();
setInterval(tick,1000);

/* Wardrobe planner */
const IC = {
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/>',
  hanger: '<path d="M12 8V6.5a2 2 0 1 1 2 2L3 16.5a1 1 0 0 0 .6 1.8h16.8a1 1 0 0 0 .6-1.8L12 11"/>'
};

const ln = (i,inner) =>
  `<div class="ln"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[i]}</svg><div>${inner}</div></div>`;

$("wp").innerHTML = C.dress.map((e,i) => `
  <article class="wr rv ${i%2 ? "rt" : "lt"}">
    <div class="art" role="img" aria-label="${e.name} outfit rack" tabindex="0">
      <img src="${e.img}" alt="" loading="lazy">
    </div>
    <div class="info">
      <h3>${e.name}</h3>
      ${ln("clock",e.time)}
      ${ln("pin",e.place)}
      ${ln("hanger",`<small>DRESS CODE</small><span class="code">${e.code}</span>`)}
      <p class="note">${e.note}</p>
      <div class="sw" aria-label="Suggested palette">
        ${e.pal.map((c,k) => `<i style="background:${c};--k:${k}"></i>`).join("")}
      </div>
    </div>
  </article>
`).join("");

document.querySelectorAll(".art").forEach(a => {
  const go = (x,y) => {
    a.classList.remove("wig");
    void a.offsetWidth;
    a.classList.add("wig");
    burst(x,y);
  };

  a.addEventListener("click",e => go(e.clientX,e.clientY));

  a.addEventListener("keydown",e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      const r = a.getBoundingClientRect();
      go(r.left+r.width/2,r.top+r.height/2);
    }
  });
});

/* Scroll reveal */
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("in");
        io.unobserve(e.target);
      }
    }),{threshold:.12,rootMargin:"0px 0px -4% 0px"})
  : {observe:el => el.classList.add("in"),unobserve(){}};

document.querySelectorAll(".rv,.photo").forEach(el => io.observe(el));

/* Hero life: flocks of birds, diagonal petals, drifting clouds */
(function() {
  const scene = $("scene"), fx = $("fx"), hc = $("hc");
  const size = () => {
    scene.style.setProperty("--W", scene.clientWidth);
    scene.style.setProperty("--H", scene.clientHeight);
  };
  size();
  addEventListener("resize", size);

  /* clouds */
  const cloud = '<svg viewBox="0 0 220 90" aria-hidden="true"><g fill="#fff"><ellipse cx="58" cy="60" rx="54" ry="22"/><ellipse cx="108" cy="42" rx="48" ry="33"/><ellipse cx="160" cy="58" rx="48" ry="23"/><ellipse cx="128" cy="30" rx="26" ry="18"/></g></svg>';
  for (let i=0;i<(small?4:5);i++) {
    const c = document.createElement("div");
    const t = rnd(75,130);
    c.className = "cl";
    c.style.cssText = `--y:${rnd(10,48).toFixed(1)}%;--w:${rnd(26,46).toFixed(0)}%;--o:${rnd(.45,.75).toFixed(2)};--t:${t.toFixed(0)}s;--dl:-${rnd(0,t).toFixed(0)}s`;
    c.innerHTML = cloud;
    hc.appendChild(c);
  }

  /* birds fly in loose flocks */
  const bird = '<svg viewBox="0 0 40 20"><path class="wing" d="M20 12Q10 0 0 6Q10 6 20 12Q30 6 40 6Q30 0 20 12Z" fill="currentColor"/></svg>';
  const shape = [[0,0],[28,12],[-24,16],[56,-6],[-50,30],[84,10],[16,-22]];
  [[26,30,-12,-.05],[16,44,-30,-.08]].forEach(([y,t,dl,rise],k) => {
    const f = document.createElement("div");
    f.className = "flock";
    f.style.cssText = `--y:${y}%;--t:${t}s;--dl:${dl}s;--rise:${rise}`;
    shape.slice(0,k ? 5 : 7).forEach(([x,yy]) => {
      const b = document.createElement("div");
      b.className = "bird";
      b.style.cssText = `--bx:${x}px;--by:${yy}px;--s:${rnd(16,28).toFixed(0)}px;--bt:${rnd(1.6,2.8).toFixed(1)}s`;
      b.innerHTML = bird;
      b.querySelector(".wing").style.animationDuration = rnd(.4,.62).toFixed(2)+"s";
      f.appendChild(b);
    });
    fx.appendChild(f);
  });

  /* petals: large and soft, falling on a diagonal */
  for (let i=0;i<(small?10:15);i++) {
    const s = rnd(20,66), x0 = rnd(-.25,.65), t = rnd(15,28);
    const p = document.createElement("div");
    p.className = "petal";
    p.style.cssText = `--s:${s.toFixed(0)}px;--b:${(s/30).toFixed(1)}px;--x0:${x0.toFixed(2)};--x1:${(x0+rnd(.5,.8)).toFixed(2)};--t:${t.toFixed(0)}s;--dl:-${rnd(0,t).toFixed(0)}s;--ft:${rnd(2.4,5).toFixed(1)}s`;
    p.innerHTML = "<i></i>";
    fx.appendChild(p);
  }
})();

/* Floating clouds in schedule */
function sky(el,n,color,opacity) {
  const shape = `<svg viewBox="0 0 220 90" aria-hidden="true"><g fill="${color}"><ellipse cx="60" cy="58" rx="52" ry="22"/><ellipse cx="112" cy="42" rx="46" ry="32"/><ellipse cx="160" cy="58" rx="46" ry="22"/></g></svg>`;

  for (let i=0;i<n;i++) {
    const w = rnd(110,280);
    const dur = rnd(70,140);
    const cw = document.createElement("div");
    cw.className = "cw";
    cw.style.top = (4+i*(88/n)+Math.random()*8)+"%";
    cw.dataset.s = rnd(.04,.14).toFixed(3);
    cw.innerHTML = `<span class="cloud" style="width:${w}px;opacity:${opacity*rnd(.6,1)};animation-duration:${dur}s;animation-delay:-${rnd(0,dur)}s">${shape}</span>`;
    el.appendChild(cw);
  }
}

sky($("sky2"),small?3:4,"#cfe2f0",.55);
const clouds = [...document.querySelectorAll(".cw")];

/* Hearts burst */
function burst(x,y) {
  if (still) return;

  for (let i=0;i<14;i++) {
    const s = document.createElement("span");
    const a = Math.PI*2*i/14+Math.random()*.4;
    const d = rnd(50,120);
    s.textContent = "♥";
    s.style.cssText = `position:fixed;left:${x}px;top:${y}px;color:var(--heart);font-size:${rnd(12,26)}px;pointer-events:none;z-index:30`;
    document.body.appendChild(s);

    s.animate([
      {transform:"translate(-50%,-50%) scale(.3)",opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-30}px)) scale(1)`,opacity:0}
    ],{duration:rnd(900,1500),easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish = () => s.remove();
  }
}

$("hearts").addEventListener("click",e => {
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2);
});

/* Scroll effects */
const env = document.querySelector(".env");
const letter = document.querySelector(".letter");
const tl = $("tl");
const bar = $("bar");

function frame() {
  ticking = false;
  const y = scrollY;
  const H = innerHeight;

  bar.style.transform = `scaleX(${clamp01(y/(document.documentElement.scrollHeight-H))})`;

  const r = env.getBoundingClientRect();
  const h = letter.offsetHeight;
  const eh = env.clientHeight;
  const p2 = letter.querySelector("#lt p:nth-child(2)") || letter.querySelector("#lt p");
  const textBottom = eh-(letter.offsetTop+p2.offsetTop+p2.offsetHeight);
  const lift = Math.max(0,eh*.6-textBottom)+14;

  env.style.marginTop = Math.max(0,h+lift-r.height*.78+24)+"px";

  const p = still ? 1 : clamp01((H*.7-r.top)/(r.height*1.1+lift));
  const e = p*p*(3-2*p);

  letter.style.transform = `translateY(${(1-e)*(h-r.height*.08)-e*lift}px)`;

  const t = tl.getBoundingClientRect();
  tl.style.setProperty("--p",still?1:clamp01((H*.75-t.top)/t.height));

  if (!still) {
    clouds.forEach(c => {
      const host = c.parentElement.getBoundingClientRect();
      c.style.transform = `translateY(${(host.top+host.height/2-H/2)*-c.dataset.s}px)`;
    });
  }
}

const queue = () => {
  if (!ticking) {
    ticking = true;
    requestAnimationFrame(frame);
  }
};

addEventListener("scroll",queue,{passive:true});
addEventListener("resize",queue);
addEventListener("load",queue);
frame();

/* Music button */
const au = $("music");
const play = $("play");
const ICON_PLAY = '<path d="M7 4l13 8-13 8z"/>';
const ICON_PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

if (C.music) {
  au.src = C.music;
  play.hidden = false;
}

play.onclick = async () => {
  try {
    if (au.paused) {
      await au.play();
    } else {
      au.pause();
    }

    play.querySelector("svg").innerHTML = au.paused ? ICON_PLAY : ICON_PAUSE;
    play.setAttribute("aria-label",au.paused ? "Play music" : "Pause music");

    const r = play.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2);
  } catch (err) {
    console.error("Music could not be played:",err);
  }
};
</script>
</body>
</html>
