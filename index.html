<style>
:root {
  --bg: #fcfcfc;
  --card: #ffffff;
  --text: #333333;
  --blue: #8ba9c1;
  --blue-line: #b3cddf;
  --blue-soft: #a1b8c7;
  --heart: #8ba9c1;
  --script: "Pinyon Script", cursive;
  --body: "Cormorant Garamond", serif;
  --head: "Bodoni Moda", serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}

* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  text-align: center;
  overflow-x: hidden;
  padding-left: env(safe-area-inset-left, 0);
  padding-right: env(safe-area-inset-right, 0);
}

h2 {
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(2.6rem, 12vw, 4rem);
  line-height: 1.1;
}

section {
  padding: 4rem 1.1rem;
  position: relative;
}

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

/* Scroll progress bar */
#bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--blue);
  transform: scaleX(0);
  transform-origin: left;
  z-index: 20;
}

/* Scroll reveal */
.rv {
  opacity: 0;
  transform: translateY(28px);
  transition:
    opacity .9s var(--ease),
    transform .9s var(--ease);
  transition-delay: var(--d, 0s);
}

.rv.in {
  opacity: 1;
  transform: none;
}

.ev.r.rv {
  transform: translateX(40px);
}

.ev.l.rv {
  transform: translateX(-40px);
}

.ev.rv.in {
  transform: none;
}

/* Animated clouds */
.sky {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.sky ~ * {
  position: relative;
  z-index: 1;
}

.cw {
  position: absolute;
  left: 0;
  will-change: transform;
}

.cloud {
  display: block;
  filter: blur(2.5px);
  animation: drift linear infinite;
  will-change: transform;
}

.cloud svg {
  display: block;
  width: 100%;
  height: auto;
}

@keyframes drift {
  from { transform: translateX(-55vw); }
  to { transform: translateX(155vw); }
}
