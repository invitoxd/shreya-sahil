<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreya Maini & Sahil Suneja — Luxury Destination Wedding</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400&family=Great+Vibes&family=Italiana&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        powderBlue: '#d4e3f0',
                        powderDark: '#b2cce2',
                        ivory: '#FAF8F5',
                        oceanDark: '#2C4C63',
                        goldAccent: '#C5A059',
                        textDark: '#2C3539'
                    },
                    fontFamily: {
                        bodoni: ['"Bodoni Moda"', 'serif'],
                        italiana: ['"Italiana"', 'serif'],
                        script: ['"Great Vibes"', 'cursive'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f2f7fc;
            color: #2C3539;
            overflow-x: hidden;
        }

        .font-script { font-family: 'Great Vibes', cursive; }
        .font-bodoni { font-family: 'Bodoni Moda', serif; }
        .font-italiana { font-family: 'Italiana', serif; }

        /* Watercolor Beach Background */
        .watercolor-beach {
            background: linear-gradient(to bottom, #d4e6f1 0%, #ebf5fb 40%, #fef9e7 80%, #f5efe6 100%);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(255,255,255,0.6) 0%, transparent 60%),
                linear-gradient(to bottom, #d4e6f1 0%, #f7f4ee 100%);
        }

        /* Envelope / Opening Gatefolds */
        #envelope-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #c4d7ec;
            background-image: 
                linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #d4e3f0 0%, #a9c6e2 100%);
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s ease;
        }

        .envelope-flap-top {
            position: absolute;
            top: 0;
            width: 100%;
            height: 50%;
            background: #b2cce2;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 25;
        }

        .envelope-open .envelope-flap-top {
            transform: rotateX(180deg);
            opacity: 0.1;
        }

        .envelope-open .envelope-body {
            transform: scale(1.1);
            opacity: 0;
            pointer-events: none;
        }

        /* Gold Starfish Seal */
        .starfish-seal {
            position: absolute;
            z-index: 35;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.5s ease;
        }

        .envelope-open .starfish-seal {
            transform: scale(0) rotate(180deg);
            opacity: 0;
            pointer-events: none;
        }

        /* Stationery Card */
        .stationery-card {
            background: #FAF8F5;
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 20px 45px rgba(44, 53, 57, 0.1);
            background-image: radial-gradient(#f0ece1 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }

        /* Subtle Wave & Cloud Animations */
        @keyframes drift {
            0% { transform: translateX(-20px); }
            50% { transform: translateX(20px); }
            100% { transform: translateX(-20px); }
        }
        .animate-drift {
            animation: drift 15s ease-in-out infinite;
        }
    </style>
</head>
<body class="antialiased watercolor-beach">

    <!-- Background Audio -->
    <audio id="bg-music" loop preload="none">
        <source src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3" type="audio/mpeg">
    </audio>

    <!-- Audio Control Button -->
    <button id="audio-toggle" onclick="toggleAudio()" class="fixed bottom-6 right-6 z-50 w-12 h-12 bg-white/90 hover:bg-white text-oceanDark rounded-full flex items-center justify-center shadow-xl border border-goldAccent/40 transition">
        <svg id="audio-icon-play" class="w-5 h-5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <svg id="audio-icon-pause" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </button>

    <!-- ENVELOPE OPENING SCREEN -->
    <div id="envelope-screen" class="envelope-body">
        <div class="envelope-flap-top"></div>
        
        <!-- Center Envelope Pocket & Card Preview -->
        <div class="relative z-20 w-11/12 max-w-md aspect-[4/5] bg-[#dce7f3] rounded-2xl shadow-2xl border border-white/60 flex flex-col items-center justify-center p-8 text-center">
            <span class="font-italiana text-xs tracking-[0.4em] text-oceanDark uppercase mb-2">You Are Invited</span>
            <h2 class="font-bodoni text-3xl text-oceanDark italic">Shreya & Sahil</h2>
            <p class="font-italiana text-xs tracking-[0.25em] text-textDark/70 mt-2">30–31 January 2027 · Goa</p>
        </div>

        <!-- Gold Starfish Seal Button -->
        <div class="starfish-seal flex flex-col items-center" onclick="openEnvelope()">
            <div class="w-20 h-20 md:w-24 md:h-24 bg-gradient-to-br from-[#dfc179] via-[#C5A059] to-[#9a7836] rounded-full flex items-center justify-center shadow-2xl border-4 border-[#FAF8F5] transform hover:scale-110 transition duration-300 ring-8 ring-white/30">
                <svg
